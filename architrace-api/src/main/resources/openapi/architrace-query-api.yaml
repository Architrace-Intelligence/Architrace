openapi: 3.1.0
info:
  title: Architrace Query API
  version: v1
  description: |
    Read-only API of the Architrace control plane. It serves the UI and scripts with the
    scopes the agents report, the agents themselves, the topology graph of a scope at a point
    in time, the services of a scope with their dependencies, the snapshot history behind
    the graph and the drift between two scopes or two points in time; later versions add
    findings.

    Every error is returned as RFC 9457 problem details with the media type
    `application/problem+json`. Errors raised by the framework (unknown path, unreadable
    parameter) carry no `type`, which RFC 9457 reads as `about:blank`; errors raised by the
    domain carry a stable type `urn:architrace:problem:<slug>` (`scope-not-found`,
    `snapshot-not-found`, `invalid-query`).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
tags:
  - name: scopes
    description: Scopes (project, environment, cluster) with at least one registered agent, their current graph and services
  - name: snapshots
    description: Snapshot history behind the graph of a scope
  - name: drift
    description: What differs between two scopes of a project, or between two points in time of one scope
  - name: agents
    description: Agents registered with the control plane
  - name: findings
    description: Architecture findings of a scope and the blast radius of any node of its graph
paths:
  /scopes:
    get:
      tags: [scopes]
      operationId: listScopes
      summary: List every scope with a registered agent
      description: |
        One summary per scope, ordered by project, environment and cluster. The counts come
        from the current graph of the scope: the latest snapshot of every agent, merged.
      responses:
        "200":
          description: Scope summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScopeSummary"
              examples:
                webshop:
                  value:
                    - scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                      agents: 2
                      liveAgents: 2
                      services: 14
                      dataStreams: 3
                      namespaces: 4
                      lastSnapshotAt: "2026-10-01T12:00:00Z"
                    - scope: { project: webshop, environment: DEV, cluster: k8s-dev }
                      agents: 1
                      liveAgents: 0
                      services: 0
                      dataStreams: 0
                      namespaces: 0
        default:
          $ref: "#/components/responses/Problem"
  /scopes/{project}/{environment}/{cluster}/graph:
    get:
      tags: [scopes]
      operationId: getGraph
      summary: Current graph of a scope at a point in time
      description: |
        The latest snapshot of every agent of the scope at or before `at`, merged into one
        graph. Nodes are united by id (versions, deployments and labels are unioned); edges are
        united by source, target and kind (calls and errors are summed, latencies take the
        maximum). Nodes are ordered by id, edges by source, target and kind. A scope without
        snapshots answers an empty graph.
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cluster"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: The graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyGraph"
              examples:
                webshop:
                  value:
                    scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                    at: "2026-10-01T12:00:00Z"
                    nodes:
                      - id: "db:postgresql/orders"
                        type: DATABASE
                        name: orders
                        versions: []
                        deployments: []
                        labels: {}
                      - id: "service:orders"
                        type: SERVICE
                        name: orders
                        versions: ["2.8.1"]
                        deployments: [{ cluster: k8s-prod-eu1, namespace: orders }]
                        labels: { team: orders }
                      - id: "topic:kafka/order-events"
                        type: TOPIC
                        name: order-events
                        versions: []
                        deployments: []
                        labels: {}
                    edges:
                      - sourceId: "service:orders"
                        targetId: "db:postgresql/orders"
                        kind: SYNC
                        metrics: { calls: 24000, errors: 3, p50Millis: 3, p95Millis: 9, p99Millis: 22, maxMillis: 140 }
                      - sourceId: "service:orders"
                        targetId: "topic:kafka/order-events"
                        kind: PUBLISH
                        metrics: { calls: 8700, errors: 0, p50Millis: 2, p95Millis: 5, p99Millis: 9, maxMillis: 60 }
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/ScopeNotFound"
        default:
          $ref: "#/components/responses/Problem"
  /scopes/{project}/{environment}/{cluster}/services:
    get:
      tags: [scopes]
      operationId: listServices
      summary: Services of a scope with their dependencies
      description: |
        Every service node of the current graph at `at`, ordered by id, each with the edges
        that end at it (`inbound`: callers and the streams it consumes) and the edges that
        start at it (`outbound`: callees, databases, external hosts and the streams it
        publishes to). The node at the other end of every edge is embedded, so the list is
        self-contained.
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cluster"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeView"
              examples:
                webshop:
                  value:
                    - node:
                        id: "service:orders"
                        type: SERVICE
                        name: orders
                        versions: ["2.8.1"]
                        deployments: [{ cluster: k8s-prod-eu1, namespace: orders }]
                        labels: {}
                      inbound:
                        - node:
                            id: "service:checkout"
                            type: SERVICE
                            name: checkout
                            versions: ["4.1.0"]
                            deployments: [{ cluster: k8s-prod-eu1, namespace: checkout }]
                            labels: {}
                          edge:
                            sourceId: "service:checkout"
                            targetId: "service:orders"
                            kind: SYNC
                            metrics: { calls: 12400, errors: 37, p50Millis: 12, p95Millis: 48, p99Millis: 90, maxMillis: 410 }
                      outbound:
                        - node:
                            id: "db:postgresql/orders"
                            type: DATABASE
                            name: orders
                            versions: []
                            deployments: []
                            labels: {}
                          edge:
                            sourceId: "service:orders"
                            targetId: "db:postgresql/orders"
                            kind: SYNC
                            metrics: { calls: 24000, errors: 3, p50Millis: 3, p95Millis: 9, p99Millis: 22, maxMillis: 140 }
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/ScopeNotFound"
        default:
          $ref: "#/components/responses/Problem"
  /scopes/{project}/{environment}/{cluster}/snapshots:
    get:
      tags: [snapshots]
      operationId: listSnapshots
      summary: Snapshot history of a scope, newest first
      description: |
        One summary per stored snapshot of the scope whose window ends between `from` and `to`
        (both inclusive, both optional), ordered by window end descending, paginated with
        `page` and `size`. The summaries carry counts only; `GET /snapshots/{snapshotId}`
        returns the nodes and edges.
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cluster"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One page of snapshot summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotPage"
              examples:
                webshop:
                  value:
                    items:
                      - id: 42
                        agentId: 1
                        scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                        window: { start: "2026-10-01T11:59:00Z", end: "2026-10-01T12:00:00Z" }
                        receivedAt: "2026-10-01T12:00:01Z"
                        nodeCount: 17
                        edgeCount: 31
                      - id: 41
                        agentId: 2
                        scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                        window: { start: "2026-10-01T11:58:30Z", end: "2026-10-01T11:59:30Z" }
                        receivedAt: "2026-10-01T11:59:31Z"
                        nodeCount: 9
                        edgeCount: 12
                    page: 0
                    size: 50
                    totalItems: 2
                    totalPages: 1
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/ScopeNotFound"
        default:
          $ref: "#/components/responses/Problem"
  /scopes/{project}/{environment}/{cluster}/diff/environments:
    get:
      tags: [drift]
      operationId: diffEnvironments
      summary: Environment drift between two scopes of a project
      description: |
        The difference between the current graph of another scope of the same project (the
        left side, `leftEnvironment` and `leftCluster`) and the current graph of this scope
        (the right side), both resolved at `at`. Nodes are matched by id, edges by source,
        target and kind; `nodesAdded` and `edgesAdded` exist only on the right,
        `nodesRemoved` and `edgesRemoved` only on the left. A node present on both sides is
        `changed` when its set of versions differs; deployments differ between environments
        by construction and are reported but not compared. Edge metrics are never compared:
        traffic is not drift. Every list is ordered by id, or by source, target and kind.
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cluster"
        - name: leftEnvironment
          in: query
          required: true
          description: Environment of the left side, a scope of the same project
          schema:
            type: string
        - name: leftCluster
          in: query
          required: true
          description: Cluster of the left side
          schema:
            type: string
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: The diff, left side relative to right side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyDiff"
              examples:
                webshop:
                  value:
                    left:
                      scope: { project: webshop, environment: DEV, cluster: k8s-dev }
                      at: "2026-10-01T12:00:00Z"
                    right:
                      scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                      at: "2026-10-01T12:00:00Z"
                    nodesAdded:
                      - id: "service:reporting"
                        type: SERVICE
                        name: reporting
                        versions: ["1.2.0"]
                        deployments: [{ cluster: k8s-prod-eu1, namespace: reporting }]
                        labels: {}
                    nodesRemoved:
                      - id: "db:postgresql/catalog"
                        type: DATABASE
                        name: catalog
                        versions: []
                        deployments: []
                        labels: {}
                    nodesChanged:
                      - id: "service:search"
                        type: SERVICE
                        name: search
                        versionsBefore: ["2.3.0"]
                        versionsAfter: ["2.2.1"]
                        deploymentsBefore: [{ cluster: k8s-dev, namespace: search }]
                        deploymentsAfter: [{ cluster: k8s-prod-eu1, namespace: search }]
                    edgesAdded:
                      - sourceId: "service:reporting"
                        targetId: "db:postgresql/orders"
                        kind: SYNC
                    edgesRemoved:
                      - sourceId: "service:search"
                        targetId: "db:postgresql/catalog"
                        kind: SYNC
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/ScopeNotFound"
        default:
          $ref: "#/components/responses/Problem"
  /scopes/{project}/{environment}/{cluster}/diff/timeline:
    get:
      tags: [drift]
      operationId: diffTimeline
      summary: Release drift of one scope between two points in time
      description: |
        The difference between the current graph of the scope at `from` (the left side) and
        at `to` (the right side, default now). Nodes are matched by id, edges by source,
        target and kind; `nodesAdded` and `edgesAdded` exist only at `to`, `nodesRemoved`
        and `edgesRemoved` only at `from`. A node present at both points is `changed` when its
        set of versions or its set of deployments differs. Edge metrics are never compared.
        Every list is ordered by id, or by source, target and kind.
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cluster"
        - name: from
          in: query
          required: true
          description: Point in time (RFC 3339) of the left side
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Point in time (RFC 3339) of the right side; defaults to now
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The diff, `from` relative to `to`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyDiff"
              examples:
                webshop:
                  value:
                    left:
                      scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                      at: "2026-09-30T18:00:00Z"
                    right:
                      scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                      at: "2026-10-01T12:00:00Z"
                    nodesAdded: []
                    nodesRemoved: []
                    nodesChanged:
                      - id: "service:orders"
                        type: SERVICE
                        name: orders
                        versionsBefore: ["2.8.0"]
                        versionsAfter: ["2.8.1"]
                        deploymentsBefore: [{ cluster: k8s-prod-eu1, namespace: orders }]
                        deploymentsAfter: [{ cluster: k8s-prod-eu1, namespace: orders }]
                    edgesAdded:
                      - sourceId: "service:orders"
                        targetId: "topic:kafka/order-events"
                        kind: PUBLISH
                    edgesRemoved: []
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/ScopeNotFound"
        default:
          $ref: "#/components/responses/Problem"
  /scopes/{project}/{environment}/{cluster}/findings:
    get:
      tags: [findings]
      operationId: listFindings
      summary: Architecture findings of a scope
      description: |
        The findings of the last rule evaluation of the scope, ordered by severity (high
        first), rule id and subject ids. The rules run right after an ingested snapshot, at
        most once per scope per evaluation interval; `evaluatedAt` says which graph the
        findings describe. `subjectNodeIds` are the nodes a finding is about, `evidence` the
        node ids that substantiate it in a rule-specific order: the cycle, the clients of the
        database, the callers, the impaired nodes, the chain.
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cluster"
        - name: severity
          in: query
          required: false
          description: Only findings of this severity
          schema:
            $ref: "#/components/schemas/Severity"
        - name: rule
          in: query
          required: false
          description: Only findings of this rule id
          schema:
            type: string
            example: cyclic-dependency
      responses:
        "200":
          description: The findings of the scope, possibly none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"
              examples:
                webshop:
                  value:
                    - ruleId: cyclic-dependency
                      severity: HIGH
                      scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                      subjectNodeIds: ["service:sales/orders", "service:sales/payments"]
                      title: Cyclic dependency between 2 services
                      detail: "orders -> payments -> orders over synchronous calls; a failure or a slowdown in any of them propagates around the cycle"
                      evidence: ["service:sales/orders", "service:sales/payments"]
                      evaluatedAt: "2026-10-05T12:00:00Z"
        "404":
          $ref: "#/components/responses/ScopeNotFound"
        default:
          $ref: "#/components/responses/Problem"
  /scopes/{project}/{environment}/{cluster}/impact:
    get:
      tags: [findings]
      operationId: getImpact
      summary: Blast radius of one node of the scope
      description: |
        What stops working if the node fails, computed on the current graph of the scope at
        `at` (default now). `impaired` lists the nodes that fail or error: the callers of the
        subject over sync edges, transitively; for a topic its producers and their callers.
        `delayed` lists the nodes that keep running but receive their data late: the
        consumers of the topics the subject or an impaired service publishes to, and the
        consumers of the subject itself when it is a topic. Each entry carries its distance
        in hops and one shortest path from the node to the subject. Both lists are ordered by
        distance, then id; the subject is in neither. `services` counts the impaired service
        nodes, `servicesTotal` the service nodes of the graph.
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cluster"
        - name: node
          in: query
          required: true
          description: Id of the subject node; ids contain `/`, hence a query parameter
          schema:
            type: string
            example: "db:postgresql/orders"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: The impact of the node on the graph at `at`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Impact"
              examples:
                webshop:
                  value:
                    subject:
                      id: "db:postgresql/orders"
                      type: DATABASE
                      name: orders
                      versions: []
                      deployments: []
                      labels: {}
                    at: "2026-10-05T12:00:00Z"
                    impaired:
                      - node:
                          id: "service:sales/orders"
                          type: SERVICE
                          name: orders
                          versions: ["2.8.1"]
                          deployments: [{ cluster: k8s-prod-eu1, namespace: orders }]
                          labels: {}
                        distance: 1
                        path: ["service:sales/orders", "db:postgresql/orders"]
                    delayed:
                      - node:
                          id: "service:sales/reporting"
                          type: SERVICE
                          name: reporting
                          versions: ["1.2.0"]
                          deployments: [{ cluster: k8s-prod-eu1, namespace: reporting }]
                          labels: {}
                        distance: 3
                        path: ["service:sales/reporting", "topic:kafka/order-events", "service:sales/orders", "db:postgresql/orders"]
                    services: 1
                    servicesTotal: 2
        "404":
          $ref: "#/components/responses/NodeNotFound"
        default:
          $ref: "#/components/responses/Problem"
  /snapshots/{snapshotId}:
    get:
      tags: [snapshots]
      operationId: getSnapshot
      summary: One snapshot with its nodes and edges
      description: |
        The snapshot exactly as the agent reported it, before any merging. Nodes are ordered
        by id, edges by source, target and kind.
      parameters:
        - $ref: "#/components/parameters/SnapshotId"
      responses:
        "200":
          description: The snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
              examples:
                webshop:
                  value:
                    id: 42
                    agentId: 1
                    scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                    window: { start: "2026-10-01T11:59:00Z", end: "2026-10-01T12:00:00Z" }
                    receivedAt: "2026-10-01T12:00:01Z"
                    nodes:
                      - id: "service:orders"
                        type: SERVICE
                        name: orders
                        versions: ["2.8.1"]
                        deployments: [{ cluster: k8s-prod-eu1, namespace: orders }]
                        labels: {}
                    edges: []
        "404":
          $ref: "#/components/responses/SnapshotNotFound"
        default:
          $ref: "#/components/responses/Problem"
  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List registered agents with their liveness
      description: |
        Every agent that has ever registered, ordered by scope and name. An agent is live
        while fewer than three heartbeat intervals have passed since it was last seen.
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
              examples:
                webshop:
                  value:
                    - id: 1
                      name: prod-eu1-a
                      version: 0.4.0
                      scope: { project: webshop, environment: PROD, cluster: k8s-prod-eu1 }
                      firstSeenAt: "2026-09-30T08:15:00Z"
                      lastSeenAt: "2026-10-01T12:00:10Z"
                      live: true
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Project:
      name: project
      in: path
      required: true
      description: Project of the scope
      schema:
        type: string
    Environment:
      name: environment
      in: path
      required: true
      description: Environment of the scope
      schema:
        type: string
    Cluster:
      name: cluster
      in: path
      required: true
      description: Kubernetes cluster of the scope
      schema:
        type: string
    At:
      name: at
      in: query
      required: false
      description: |
        Point in time (RFC 3339) the graph is resolved for: the latest snapshot of every agent
        whose window ends at or before it. Defaults to now.
      schema:
        type: string
        format: date-time
    From:
      name: from
      in: query
      required: false
      description: Earliest window end to include (RFC 3339, inclusive); unbounded when absent
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Latest window end to include (RFC 3339, inclusive); unbounded when absent
      schema:
        type: string
        format: date-time
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Items per page
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      description: Snapshot id as listed by the snapshot history
      schema:
        type: integer
        format: int64
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidQuery:
      description: A query parameter is out of range or the parameters contradict each other
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            range:
              value:
                type: "urn:architrace:problem:invalid-query"
                title: Invalid query
                status: 400
                detail: "from 2026-10-01T12:00:00Z must not be after to 2026-10-01T11:00:00Z"
                instance: /api/v1/scopes/webshop/PROD/k8s-prod-eu1/snapshots
    ScopeNotFound:
      description: No agent has registered for the scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unknown:
              value:
                type: "urn:architrace:problem:scope-not-found"
                title: Scope not found
                status: 404
                detail: "no agent has registered for scope webshop/PROD/k8s-prod-eu2"
                instance: /api/v1/scopes/webshop/PROD/k8s-prod-eu2/graph
    NodeNotFound:
      description: No agent has registered for the scope, or its current graph has no node with this id
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unknownNode:
              value:
                type: "urn:architrace:problem:node-not-found"
                title: Node not found
                status: 404
                detail: "no node service:sales/nothing in the graph of scope webshop/PROD/k8s-prod-eu1"
                instance: /api/v1/scopes/webshop/PROD/k8s-prod-eu1/impact
            unknownScope:
              value:
                type: "urn:architrace:problem:scope-not-found"
                title: Scope not found
                status: 404
                detail: "no agent has registered for scope webshop/PROD/k8s-prod-eu2"
                instance: /api/v1/scopes/webshop/PROD/k8s-prod-eu2/impact
    SnapshotNotFound:
      description: No snapshot has this id, or it has been removed by retention
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unknown:
              value:
                type: "urn:architrace:problem:snapshot-not-found"
                title: Snapshot not found
                status: 404
                detail: "no snapshot with id 7"
                instance: /api/v1/snapshots/7
  schemas:
    Scope:
      type: object
      description: The project, environment and cluster an agent reports under.
      required: [project, environment, cluster]
      properties:
        project:
          type: string
          description: Project the agent reports under (`default` when the agent sets none)
        environment:
          type: string
          description: Environment the agent observes, for example `DEV`, `STAGE`, `PROD`
        cluster:
          type: string
          description: Kubernetes cluster the agent runs in
    ScopeSummary:
      type: object
      description: One row of the Projects list.
      required: [scope, agents, liveAgents, services, dataStreams, namespaces, findings]
      properties:
        scope:
          $ref: "#/components/schemas/Scope"
        agents:
          type: integer
          format: int32
          minimum: 0
          description: Agents registered for the scope
        liveAgents:
          type: integer
          format: int32
          minimum: 0
          description: Agents seen within the last three heartbeat intervals
        services:
          type: integer
          format: int32
          minimum: 0
          description: Service nodes in the current graph
        dataStreams:
          type: integer
          format: int32
          minimum: 0
          description: Topic and queue nodes in the current graph
        namespaces:
          type: integer
          format: int32
          minimum: 0
          description: Distinct namespaces of the deployments in the current graph
        findings:
          $ref: "#/components/schemas/FindingCounts"
        lastSnapshotAt:
          type: string
          format: date-time
          description: End of the newest snapshot window; absent until the first snapshot arrives
    TopologyGraph:
      type: object
      description: The current graph of a scope at a point in time.
      required: [scope, at, nodes, edges]
      properties:
        scope:
          $ref: "#/components/schemas/Scope"
        at:
          type: string
          format: date-time
          description: Point in time the graph was resolved for
        nodes:
          type: array
          description: Nodes ordered by id
          items:
            $ref: "#/components/schemas/TopologyNode"
        edges:
          type: array
          description: Edges ordered by source, target and kind
          items:
            $ref: "#/components/schemas/TopologyEdge"
    TopologyNode:
      type: object
      description: A service, database, topic or external host.
      required: [id, type, name, versions, deployments, labels]
      properties:
        id:
          type: string
          description: |
            Stable node id, the same in every scope and snapshot, for example `service:orders`,
            `db:postgresql/orders`, `topic:kafka/order-events`. It may contain `/`.
        type:
          $ref: "#/components/schemas/NodeType"
        name:
          type: string
          description: Display name
        versions:
          type: array
          description: Versions seen for the node; empty for nodes without a version
          items:
            type: string
        deployments:
          type: array
          description: Where the node runs; empty for nodes the agent does not see deployed
          items:
            $ref: "#/components/schemas/Deployment"
        labels:
          type: object
          description: Free-form labels reported by the agent
          additionalProperties:
            type: string
    NodeType:
      type: string
      description: What a node stands for.
      enum: [SERVICE, DATABASE, TOPIC, EXTERNAL]
    Deployment:
      type: object
      description: One place a node runs.
      required: [cluster, namespace]
      properties:
        cluster:
          type: string
          description: Kubernetes cluster
        namespace:
          type: string
          description: Kubernetes namespace; empty when unknown
    TopologyEdge:
      type: object
      description: A dependency between two nodes with the metrics of the window.
      required: [sourceId, targetId, kind, metrics]
      properties:
        sourceId:
          type: string
          description: Id of the node the edge starts at
        targetId:
          type: string
          description: Id of the node the edge ends at
        kind:
          $ref: "#/components/schemas/EdgeKind"
        metrics:
          $ref: "#/components/schemas/EdgeMetrics"
    EdgeKind:
      type: string
      description: |
        Direction follows the data: `SYNC` goes from the caller to the callee, `PUBLISH` from
        the producer to the topic, `CONSUME` from the topic to the consumer.
      enum: [SYNC, PUBLISH, CONSUME]
    EdgeMetrics:
      type: object
      description: Calls, errors and latency percentiles of an edge in the window.
      required: [calls, errors, p50Millis, p95Millis, p99Millis, maxMillis]
      properties:
        calls:
          type: integer
          format: int64
          minimum: 0
        errors:
          type: integer
          format: int64
          minimum: 0
        p50Millis:
          type: integer
          format: int64
          minimum: 0
        p95Millis:
          type: integer
          format: int64
          minimum: 0
        p99Millis:
          type: integer
          format: int64
          minimum: 0
        maxMillis:
          type: integer
          format: int64
          minimum: 0
    NodeView:
      type: object
      description: A node of the current graph with the edges that touch it and their other ends.
      required: [node, inbound, outbound]
      properties:
        node:
          $ref: "#/components/schemas/TopologyNode"
        inbound:
          type: array
          description: Edges that end at the node, ordered by source, target and kind
          items:
            $ref: "#/components/schemas/Dependency"
        outbound:
          type: array
          description: Edges that start at the node, ordered by source, target and kind
          items:
            $ref: "#/components/schemas/Dependency"
    Dependency:
      type: object
      description: One edge seen from one of its nodes, with the node at the other end.
      required: [node, edge]
      properties:
        node:
          $ref: "#/components/schemas/TopologyNode"
        edge:
          $ref: "#/components/schemas/TopologyEdge"
    TimeWindow:
      type: object
      description: The half-open time range a snapshot covers.
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    SnapshotSummary:
      type: object
      description: One stored snapshot without its nodes and edges.
      required: [id, agentId, scope, window, receivedAt, nodeCount, edgeCount]
      properties:
        id:
          type: integer
          format: int64
        agentId:
          type: integer
          format: int64
          description: Agent that reported the snapshot
        scope:
          $ref: "#/components/schemas/Scope"
        window:
          $ref: "#/components/schemas/TimeWindow"
        receivedAt:
          type: string
          format: date-time
          description: When the control plane stored the snapshot
        nodeCount:
          type: integer
          format: int32
          minimum: 0
        edgeCount:
          type: integer
          format: int32
          minimum: 0
    Snapshot:
      type: object
      description: One stored snapshot as the agent reported it.
      required: [id, agentId, scope, window, receivedAt, nodes, edges]
      properties:
        id:
          type: integer
          format: int64
        agentId:
          type: integer
          format: int64
          description: Agent that reported the snapshot
        scope:
          $ref: "#/components/schemas/Scope"
        window:
          $ref: "#/components/schemas/TimeWindow"
        receivedAt:
          type: string
          format: date-time
          description: When the control plane stored the snapshot
        nodes:
          type: array
          description: Nodes ordered by id
          items:
            $ref: "#/components/schemas/TopologyNode"
        edges:
          type: array
          description: Edges ordered by source, target and kind
          items:
            $ref: "#/components/schemas/TopologyEdge"
    SnapshotPage:
      type: object
      description: One page of snapshot summaries.
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotSummary"
        page:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based index of this page
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size
        totalItems:
          type: integer
          format: int64
          minimum: 0
          description: Snapshots matching the filter across all pages
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Pages needed for all matching snapshots; `0` when nothing matches
    TopologyDiff:
      type: object
      description: |
        What differs between two graphs: the left side and the right side. Everything "added"
        exists only on the right, everything "removed" only on the left.
      required: [left, right, nodesAdded, nodesRemoved, nodesChanged, edgesAdded, edgesRemoved]
      properties:
        left:
          $ref: "#/components/schemas/GraphRef"
        right:
          $ref: "#/components/schemas/GraphRef"
        nodesAdded:
          type: array
          description: Nodes only on the right, as seen on the right, ordered by id
          items:
            $ref: "#/components/schemas/TopologyNode"
        nodesRemoved:
          type: array
          description: Nodes only on the left, as seen on the left, ordered by id
          items:
            $ref: "#/components/schemas/TopologyNode"
        nodesChanged:
          type: array
          description: Nodes on both sides whose compared attributes differ, ordered by id
          items:
            $ref: "#/components/schemas/NodeChange"
        edgesAdded:
          type: array
          description: Edges only on the right, ordered by source, target and kind
          items:
            $ref: "#/components/schemas/EdgeRef"
        edgesRemoved:
          type: array
          description: Edges only on the left, ordered by source, target and kind
          items:
            $ref: "#/components/schemas/EdgeRef"
    GraphRef:
      type: object
      description: One side of a diff, the scope and the point in time its graph was resolved for.
      required: [scope, at]
      properties:
        scope:
          $ref: "#/components/schemas/Scope"
        at:
          type: string
          format: date-time
    NodeChange:
      type: object
      description: A node present on both sides with the attributes of each side.
      required: [id, type, name, versionsBefore, versionsAfter, deploymentsBefore, deploymentsAfter]
      properties:
        id:
          type: string
          description: Stable node id, the same on both sides
        type:
          $ref: "#/components/schemas/NodeType"
        name:
          type: string
          description: Display name, taken from the right side
        versionsBefore:
          type: array
          description: Versions seen on the left
          items:
            type: string
        versionsAfter:
          type: array
          description: Versions seen on the right
          items:
            type: string
        deploymentsBefore:
          type: array
          description: Where the node runs on the left
          items:
            $ref: "#/components/schemas/Deployment"
        deploymentsAfter:
          type: array
          description: Where the node runs on the right
          items:
            $ref: "#/components/schemas/Deployment"
    EdgeRef:
      type: object
      description: The identity of an edge without its metrics.
      required: [sourceId, targetId, kind]
      properties:
        sourceId:
          type: string
        targetId:
          type: string
        kind:
          $ref: "#/components/schemas/EdgeKind"
    FindingCounts:
      type: object
      description: Findings of the last rule evaluation of the scope, counted per severity; all zero before the first evaluation and when the graph is clean.
      required: [high, medium, low]
      properties:
        high:
          type: integer
          format: int32
          minimum: 0
        medium:
          type: integer
          format: int32
          minimum: 0
        low:
          type: integer
          format: int32
          minimum: 0
    Severity:
      type: string
      description: How urgent a finding is; the severity is fixed per rule.
      enum: [HIGH, MEDIUM, LOW]
    Finding:
      type: object
      description: One result of an architecture rule on the current graph of a scope.
      required: [ruleId, severity, scope, subjectNodeIds, title, detail, evidence, evaluatedAt]
      properties:
        ruleId:
          type: string
          description: Rule that raised the finding, kebab-case (`cyclic-dependency`, `shared-database`, `unknown-external`, `wide-blast-radius`, `cross-domain-coupling`, `fan-in-hub`, `long-sync-chain`)
        severity:
          $ref: "#/components/schemas/Severity"
        scope:
          $ref: "#/components/schemas/Scope"
        subjectNodeIds:
          type: array
          description: Ids of the nodes the finding is about, never empty
          minItems: 1
          items:
            type: string
        title:
          type: string
          description: One line naming the problem and its subject
        detail:
          type: string
          description: One or two sentences with the evidence in words and why it matters
        evidence:
          type: array
          description: Node ids that substantiate the finding, in a rule-specific order
          items:
            type: string
        evaluatedAt:
          type: string
          format: date-time
          description: Point in time of the graph the rules ran on
    Impact:
      type: object
      description: The blast radius of one node, computed on the current graph of its scope at `at`.
      required: [subject, at, impaired, delayed, services, servicesTotal]
      properties:
        subject:
          $ref: "#/components/schemas/TopologyNode"
        at:
          type: string
          format: date-time
        impaired:
          type: array
          description: Nodes that fail or error when the subject fails, ordered by distance then id
          items:
            $ref: "#/components/schemas/ImpactedNode"
        delayed:
          type: array
          description: Nodes that keep running but receive their data late, ordered by distance then id
          items:
            $ref: "#/components/schemas/ImpactedNode"
        services:
          type: integer
          format: int32
          minimum: 0
          description: Impaired service nodes
        servicesTotal:
          type: integer
          format: int32
          minimum: 0
          description: Service nodes of the graph
    ImpactedNode:
      type: object
      description: One node reached by the failure, with the shortest path that connects it to the subject.
      required: [node, distance, path]
      properties:
        node:
          $ref: "#/components/schemas/TopologyNode"
        distance:
          type: integer
          format: int32
          minimum: 1
          description: Length of `path` in hops
        path:
          type: array
          description: Node ids from this node to the subject, both included
          minItems: 2
          items:
            type: string
    Agent:
      type: object
      description: An agent registration as the control plane sees it.
      required: [id, name, version, scope, firstSeenAt, lastSeenAt, live]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Agent name from its configuration
        version:
          type: string
          description: Agent build version, `dev` for a development build
        scope:
          $ref: "#/components/schemas/Scope"
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Last registration, heartbeat or snapshot
        live:
          type: boolean
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri
          description: |
            Problem type: absent (RFC 9457 default `about:blank`) when the status code says it
            all, otherwise a stable `urn:architrace:problem:<slug>`
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
          description: Request path that produced the problem
