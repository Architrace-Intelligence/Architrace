        <sc-for list="{{insights}}" as="i" hint-placeholder-count="3">
          <div class="insight">
            <div class="insight-title"><span class="badge {{i.badgeCls}}">{{i.badge}}</span><span>{{i.title}}</span></div>
            <div class="insight-body">{{i.body}}</div>
            <div class="insight-actions"><a class="btn btn-sm" href="{{i.href}}">{{i.action}}</a></div>
          </div>
        </sc-for>
        <div class="note">
          <svg class="ico ico-s" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
          <span>Every card comes from rules, diffs and the snapshot series. An AI insights provider, when configured, adds narrative on top of the same evidence.</span>
        </div>
