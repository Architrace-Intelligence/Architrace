name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analysis.yml
