name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Build and run the quality gates
        run: ./gradlew build --continue

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            architrace-ui/build/coverage/lcov.info
            !.gradle/**
            !**/node_modules/**

      - name: Upload the jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jars
          if-no-files-found: error
          path: |
            architrace-agent/build/libs/*-all.jar
            architrace-control-plane/build/libs/*.jar

  quality:
    name: quality
    needs: build
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Download the reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports

      - name: Analyse with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew compileJava compileTestJava sonar

      - name: Wait for the SonarCloud quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: build/sonar/report-task.txt

  security:
    name: security
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Set up the Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@b075801f26076be9bb50521154cafab73f44da0c # 2026-09-29

      - name: Test the dependencies with Snyk
        if: env.SNYK_TOKEN != ''
        env:
          SNYK_ORG: ${{ vars.SNYK_ORG }}
        run: snyk test --all-projects --exclude=otel-test-app,build-logic --severity-threshold=high --org="$SNYK_ORG"

      - name: Report the skipped Snyk test
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::Snyk test skipped because SNYK_TOKEN is not available to this run."

      - name: Compute the NVD cache key
        id: nvd
        if: ${{ !cancelled() && env.NVD_API_KEY != '' }}
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the NVD data
        if: ${{ !cancelled() && env.NVD_API_KEY != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ steps.nvd.outputs.week }}
          restore-keys: dependency-check-data-

      - name: Check the dependencies against the NVD
        if: ${{ !cancelled() && env.NVD_API_KEY != '' }}
        run: ./gradlew dependencyCheckAggregate --no-parallel

      - name: Report the skipped Dependency-Check
        if: ${{ !cancelled() && env.NVD_API_KEY == '' }}
        run: echo "::warning::OWASP Dependency-Check skipped because NVD_API_KEY is not available to this run."

      - name: Upload the Dependency-Check results to code scanning
        if: ${{ !cancelled() && env.NVD_API_KEY != '' && github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
          category: dependency-check

      - name: Install gitleaks
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check --strict
          mkdir -p gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks

      - name: Scan the commits for secrets
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --no-banner --exit-code 1
          --log-opts="$BASE_SHA..$HEAD_SHA" .

  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation/architrace-inteligence
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: documentation/architrace-inteligence/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Build the site
        run: npm run build
