name: Set up the build
description: Installs the JDK declared in gradle.properties, configures Gradle with its caches and keeps the Node.js distribution that Gradle downloads between runs.

runs:
  using: composite
  steps:
    - name: Read the toolchain versions
      id: versions
      shell: bash
      run: |
        {
          echo "java=$(sed -n 's/^javaVersion=//p' gradle.properties)"
          echo "node=$(sed -n 's/^nodeVersion=//p' gradle.properties)"
        } >> "$GITHUB_OUTPUT"

    - name: Set up the JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: ${{ steps.versions.outputs.java }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Cache the Node.js distribution
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .gradle/nodejs
        key: nodejs-${{ runner.os }}-${{ steps.versions.outputs.node }}
