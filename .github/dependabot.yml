version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-dependencies:
        patterns: ["*"]
    labels: [chore]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    labels: [ci]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: npm
    directory: /documentation/architrace-inteligence
    schedule:
      interval: weekly
      day: monday
    groups:
      docs-site:
        patterns: ["*"]
    labels: [chore]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /architrace-ui
    schedule:
      interval: weekly
      day: monday
    groups:
      ui-dependencies:
        patterns: ["*"]
    labels: [chore]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: pip
    directory: /otel-test-app
    schedule:
      interval: monthly
    labels: [chore]
    commit-message:
      prefix: "build(deps)"
